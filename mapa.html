function dec(){const els=S.querySelectorAll('.p');if(!els.length)return;const by={},acc=[],r=S.getBoundingClientRect();els.forEach(g=>by[g.dataset.k]=g);
 CURP.slice().sort((a,b)=>(b.id==FOC)-(a.id==FOC)||a.rank-b.rank).forEach(p=>{const g=by[p.id];if(!g)return;g.firstChild.setAttribute('transform',`scale(${1/k})`);const sx=tx+p.x*k,sy=ty+p.y*k,hw=Math.max(p.z/2,p.nm.length*4.7+4),bx=[sx-hw-3,sy-p.z-3,sx+hw+3,sy+20],off=sx<-60||sx>r.width+60||sy<-80||sy>r.height+80,hit=acc.some(c=>bx[0]<c[2]&&bx[2]>c[0]&&bx[1]<c[3]&&bx[3]>c[1]);if(hit&&p.id!=FOC)g.setAttribute('display','none');else{g.removeAttribute('display');if(!off)acc.push(bx)}})}
function focusP(key){const p=CURP.find(q=>q.id==key);if(!p)return;FOC=key;const r=S.getBoundingClientRect();k=k0*6;tx=r.width/2-p.x*k;ty=r.height*.42-p.y*k;ap();card(key)}
const names=id=>TW[id].pois.filter(p=>p[4]);const cnt=id=>names(id).filter(p=>ST[id+'|'+p[4]]).length;
const prog=()=>{let a=0,b=0;Object.keys(TW).forEach(i=>{a+=cnt(i);b+=names(i).length});$('ipg').textContent=`✔ ${cnt(cur)}/${names(cur).length} aqui · ${a}/${b} no total`;S.querySelectorAll('.p').forEach(g=>{const v=!!ST[g.dataset.k];g.classList.toggle('v',v);g.querySelector('.bt').textContent=v?'✔':'+'})};
const fit=()=>{const r=S.getBoundingClientRect(),t=TW[cur],hh=$('ih').offsetHeight+6;k0=Math.min(r.width/t.w,(r.height-hh)/t.h)*.98;k=k0*1.75;const P=names(cur),cx=P.reduce((a,p)=>a+p[1],0)/P.length,cy=P.reduce((a,p)=>a+p[2],0)/P.length-60;tx=r.width/2-cx*k;ty=hh+(r.height-hh)/2-cy*k;ap()};
const zoom=(f,cx,cy)=>{const n=Math.max(k0*.8,Math.min(k0*14,k*f));f=n/k;tx=cx-(cx-tx)*f;ty=cy-(cy-ty)*f;k=n;ap()};
function show(id){cur=id;FOC=null;$('ik').classList.remove('o');S.querySelector('#ig')?.remove();S.insertAdjacentHTML('beforeend',build(id));$('itl').textContent=TW[id].n;$('isb').textContent=TW[id].sb;[...$('itb').children].forEach(b=>b.classList.toggle('on',b.dataset.i==id));fit();prog()}
function card(k_){const[id,n]=k_.split('|'),p=TW[id].pois.find(p=>p[4]==n),v=!!ST[k_];$('kc').innerHTML=`<h3>${n}</h3>${p[5]?`<p>${p[5]}</p>`:''}<button class="vbtn${v?' v':''}" data-k="${k_}">${v?'✔ Já visitei':'☐ Marcar como visitado'}</button><input id="kn" placeholder="Notas: hora, bilhete, reserva…" value="${(ST['n|'+k_]||'').replace(/"/g,'&quot;')}">`;$('ik').classList.add('o');$('kn').oninput=e=>{ST['n|'+k_]=e.target.value;sv()}}
$('kc').onclick=e=>{const b=e.target.closest('.vbtn');if(!b)return;const q=b.dataset.k;ST[q]=!ST[q];sv();card(q);prog();lst()};$('kx').onclick=()=>$('ik').classList.remove('o');
function lst(){$('yc').innerHTML='<h3>📋 A minha viagem</h3>'+Object.keys(TW).map(i=>`<h4>${TW[i].n} <small>${cnt(i)}/${names(i).length}</small></h4>`+names(i).map(p=>`<label><input type="checkbox" data-k="${i}|${p[4]}" ${ST[i+'|'+p[4]]?'checked':''}> <span data-f="${i}|${p[4]}">${p[4]}</span></label>`).join('')).join('')}
$('yc').onclick=e=>{const s=e.target.closest('[data-f]');if(!s)return;e.preventDefault();const f=s.dataset.f,t=f.split('|')[0];$('iy').classList.remove('o');if(cur!=t)show(t);focusP(f)};$('yc').onchange=e=>{const q=e.target.dataset.k;if(q){ST[q]=e.target.checked;sv();prog();lst()}};$('iw').onclick=()=>{lst();$('iy').classList.toggle('o')};$('yx').onclick=()=>$('iy').classList.remove('o');
$('itb').innerHTML=Object.keys(TW).map(i=>`<button data-i="${i}">${TW[i].n}</button>`).join('');$('itb').onclick=e=>{if(e.target.dataset.i){$('ik').classList.remove('o');show(e.target.dataset.i)}};
$('bi').onclick=()=>{el.classList.add('o');show(cur)};$('ix').onclick=()=>el.classList.remove('o');$('ir').onclick=fit;
$('iz').onclick=()=>zoom(1.5,innerWidth/2,innerHeight/2);$('im').onclick=()=>zoom(1/1.5,innerWidth/2,innerHeight/2);
$('iv').onclick=()=>{el.classList.remove('o');const a=byId[cur];map.flyTo({center:[a.lon,a.lat],zoom:cur=='str'?15.2:15.8,pitch:62,bearing:-20,duration:2500})};
S.onwheel=e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*.002),e.clientX,e.clientY)};
const pt=new Map();let pd=0,dn=null;S.onpointerdown=e=>{dn={x:e.clientX,y:e.clientY,t:e.target};S.setPointerCapture(e.pointerId);pt.set(e.pointerId,[e.clientX,e.clientY]);if(pt.size==2){dn=null;const[a,b]=[...pt.values()];pd=Math.hypot(a[0]-b[0],a[1]-b[1])}};
S.onpointermove=e=>{if(!pt.has(e.pointerId))return;const o=pt.get(e.pointerId);pt.set(e.pointerId,[e.clientX,e.clientY]);if(pt.size==2){const[a,b]=[...pt.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);zoom(d/pd,(a[0]+b[0])/2,(a[1]+b[1])/2);pd=d}else{tx+=e.clientX-o[0];ty+=e.clientY-o[1];ap()}};
S.onpointerup=e=>{pt.delete(e.pointerId);if(dn&&Math.hypot(e.clientX-dn.x,e.clientY-dn.y)<7){const g=dn.t.closest&&dn.t.closest('.p');if(g)card(g.dataset.k)}dn=null};S.onpointercancel=e=>pt.delete(e.pointerId);
addEventListener('resize',()=>el.classList.contains('o')&&fit());

// ---- música de Natal: faixas da pasta audio/ por ordem aleatória (sem repetir até tocarem todas)
{let TR=["audio/all-i-want.m4a", "audio/las-christmas.m4a", "audio/polar-express.m4a", "audio/misteltoe.m4a", "audio/we-are-the-world.m4a", "audio/jingle-bell-rock.m4a", "audio/noite-branca.m4a", "audio/rock-a-round.m4a", "audio/they-know-its-christmas.m4a", "audio/halleluyah.m4a", "audio/a-todos-um-bom-natal.m4a", "audio/look-like-christmas.m4a"];fetch('audio/musicas.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(a=>{if(Array.isArray(a)&&a.length){TR=a.map(x=>'audio/'+encodeURIComponent(x));bag=[]}}).catch(()=>{});let bag=[],last=-1,au=null,on=false,muted=false,warned=false,fails=0;try{muted=localStorage.getItem('alsacia_mute')=='1'}catch(e){}
const bs=[],set=v=>{on=v;bs.forEach(b=>b.classList.toggle('on',v))},sm=v=>{muted=v;try{localStorage.setItem('alsacia_mute',v?'1':'0')}catch(e){}};
const pick=()=>{if(!bag.length){bag=TR.map((_,i)=>i).sort(()=>Math.random()-.5);if(bag.length>1&&bag[0]==last)bag.push(bag.shift())}last=bag.shift();return TR[last]};
const go=()=>{au.src=pick();return au.play().then(()=>set(true)).catch(()=>set(false))};
const init=()=>{if(au)return;au=new Audio();au.preload='auto';au.onended=go;au.onerror=()=>{fails++;if(fails>=TR.length){set(false);if(!warned){warned=true;alert('Não encontrei a música. Coloca a pasta "audio" junto do mapa.html.')}return}go()};au.onplaying=()=>{fails=0}};
const play=()=>{init();if(!au.src)go();else au.play().then(()=>set(true)).catch(()=>set(false))};
const tgl=()=>{if(on){au.pause();set(false);sm(true)}else{sm(false);play()}};
const mk=(p,bf,t,ti,fn,tg)=>{const b=document.createElement('button');b.textContent=t;b.title=ti;b.setAttribute('aria-label',ti);bf?p.insertBefore(b,bf):p.appendChild(b);b.onclick=fn;if(tg)bs.push(b);return b};
[[$('ic'),$('ix')],[document.querySelector('.tools'),null]].forEach(([p,bf])=>{const m=mk(p,bf,'🎵','Música de Natal',tgl,1);if(p.id=='ic')m.id='imu';mk(p,bf,'⏭','Próxima música',()=>{init();sm(false);go()})});
$('bi').addEventListener('click',()=>{if(!muted&&!on)play()});$('ix').addEventListener('click',()=>{if(on){au.pause();set(false)}});
const st=document.createElement('style');st.textContent='#ic button.on,.tools button.on{background:#2fbf71;color:#fff}.mk.pt b{display:block!important}';document.head.appendChild(st)}
// ---- 2 pontos marcados (localizados em tempo real no OpenStreetMap)
{const PT=[['pt1','Rue de Stutzheim','Rue de Stutzheim, Strasbourg','Estrasburgo'],['pt2','Rue du Grillenbreit','Rue du Grillenbreit, Colmar','Colmar']];
const geo=async q=>{const k='geo|'+q;try{const c=localStorage.getItem(k);if(c)return JSON.parse(c)}catch(e){}const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=fr&q='+encodeURIComponent(q));const j=await r.json();if(!j[0])return null;const v=[+j[0].lon,+j[0].lat];try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}return v};
let pend=PT.length,bad=[];const say=t=>{const e=$('toast');e.style.background='#1f6a45';e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',6000)};PT.forEach(async([id,n,q,town])=>{try{const v=await geo(q);if(!v){bad.push(n);return}const a={id,n,lat:v[1],lon:v[0],em:'📍',col:'#c0392b',pr:0,d:'Ponto marcado: '+n+', '+town+'.',h:'',mk:false,tp:'Ponto marcado',town};const e=document.createElement('div');e.className='mk pt';e.innerHTML=`<i style="background:#c0392b">📍</i><b>${n}</b>`;e.onclick=ev=>{ev.stopPropagation();show(a,1)};a.e=e;new maplibregl.Marker({element:e,anchor:'bottom'}).setLngLat(v).addTo(map);ALL.push(a);byId[id]=a;const b=document.createElement('button');b.className='ch';b.dataset.j=id;b.textContent='📍 '+n.replace('Rue ','');$('ch').insertBefore(b,$('cm'))}catch(e){bad.push(n)}finally{if(!--pend)say(bad.length?'📍 Não localizei: '+bad.join(', '):'📍 2 pontos marcados no mapa')}})}

// ---- ligação profunda a partir do roteiro: #ilus=col | #fly=col | #find=Nome%2C%20Cidade&pid=ID&d=1
window.openIlus=id=>{if(id&&TW[id])cur=id;el.classList.add('o');show(cur)};
{const say=t=>{const e=$('toast');e.style.background='#1f6a45';e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',5000)};
const he=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gq=async q=>{const k='geo|'+q;try{const c=localStorage.getItem(k);if(c)return JSON.parse(c)}catch(e){}const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));const j=await r.json();if(!j[0])return null;const v=[+j[0].lon,+j[0].lat];try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}return v};
let fm=null;
const find=async(q,pid,done)=>{el.classList.remove('o');const nm=q.split(',')[0];let v=null;try{v=await gq(q)}catch(e){}if(!v){say('Não encontrei "'+nm+'" no mapa.');return}
 if(fm)fm.remove();const e=document.createElement('div');e.className='mk pt';e.innerHTML=`<i style="background:#c0392b">📍</i><b>${he(nm)}</b>`;fm=new maplibregl.Marker({element:e,anchor:'bottom'}).setLngLat(v).addTo(map);
 map.flyTo({center:v,zoom:17.2,pitch:62,bearing:-20,duration:2200});
 const q2=encodeURIComponent(q);let dn=!!+done;
 const draw=()=>{$('shc').innerHTML=`<h2>📍 ${he(nm)}</h2><p>${he(q)}</p><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${q2}&travelmode=walking">🚶 Ir a pé</a><a class="o" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${q2}">🗺 Google Maps</a>${pid?`<button class="b" id="fvb">${dn?'✔ Já visitei':'☐ Marcar como visitado'}</button>`:''}`;const b=$('fvb');if(b)b.onclick=()=>{dn=!dn;try{parent.postMessage({visited:pid,on:dn},'*')}catch(x){}draw()};$('sh').classList.add('o')};draw()};
const go=()=>{const p=new URLSearchParams(location.hash.slice(1));if(p.has('find')){find(p.get('find'),p.get('pid'),p.get('d'));return}const k=p.has('ilus')?'ilus':p.has('fly')?'fly':'';if(!k)return;const id=p.get(k);if(k=='ilus')openIlus(id);else{el.classList.remove('o');const a=byId[id]||byId.col;try{map.flyTo({center:[a.lon,a.lat],zoom:id=='str'?15.2:15.8,pitch:62,bearing:-20,duration:2200})}catch(e){}}};
addEventListener('hashchange',go);addEventListener('message',e=>{if(e.data&&e.data.go){const same=location.hash===e.data.go;try{location.hash=e.data.go}catch(x){}if(same)go()}});setTimeout(go,900)}
})();
